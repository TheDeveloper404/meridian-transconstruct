name: CI

# Rulează la fiecare push și PR pe main: secret scan (gitleaks) + npm audit (high/critical)
# + type-check + lint + test (vitest) + build.
# Teste verzi nu înseamnă build verde — vitest ignoră erorile de tip; build-ul prinde ce pică la deploy.
# Pre-scaffold (fără package.json) rulează doar secret scan-ul și trece; restul devine activ automat
# după scaffold-ul Next.js. Pașii cu --if-present devin activi când scriptul apare în package.json.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Istoric complet, altfel gitleaks vede doar HEAD.
          fetch-depth: 0

      # Licența gitleaks e cerută doar pe conturi de organizație; pe cont personal rulează liber.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detectează proiect scaffold-at
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.detect.outputs.ready == 'true'
        run: npm ci

      - name: Audit dependențe (high/critical)
        if: steps.detect.outputs.ready == 'true'
        run: npm audit --audit-level=high

      - name: Type-check
        if: steps.detect.outputs.ready == 'true'
        run: npm run typecheck --if-present

      - name: Lint
        if: steps.detect.outputs.ready == 'true'
        run: npm run lint --if-present

      - name: Test (vitest)
        if: steps.detect.outputs.ready == 'true'
        run: npm run test --if-present

      - name: Build
        if: steps.detect.outputs.ready == 'true'
        run: npm run build --if-present

      - name: Pre-scaffold (skip)
        if: steps.detect.outputs.ready == 'false'
        run: echo "Pre-scaffold - încă nu există package.json. CI rulează doar secret scan-ul."
